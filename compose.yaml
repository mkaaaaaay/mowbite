services:
  mowbite:
    # prebuilt for amd64 and arm64. `docker compose up -d --build` builds it yourself instead
    image: ghcr.io/mkaaaaaay/mowbite:latest
    build: .
    container_name: mowbite
    restart: unless-stopped
    ports:
      - "8082:8080"
    volumes:
      # settings shared by all devices (map colors etc.)
      - settings:/data
      # the mower's wifi signal for the coverage on the map, read only. leave it out and the map has no wifi layer
      - /proc/1/net:/host-net:ro
    # shows up on the openmower start page (xtech/web-openmower-entrypoint)
    labels:
      openmower.ui: "true"
      openmower.ui.name: "MowBite"
      openmower.ui.port: "8082"
      openmower.ui.icon: "Grass"
      openmower.ui.description: "Map editor, area recording, tracks, activity and sensors"
    # all optional. without a url the app connects to ws://<host it was opened from>:9001,
    # which is right when it runs on the mower. the sensor recorder finds the broker on the
    # mower by itself, the MOWER_MQTT_HOST lines are only for a broker somewhere else
    # environment:
    #   MOWER_MQTT_WS_URL: ws://openmower:9001
    #   MOWER_MQTT_PREFIX: ""
    #   MOWER_MQTT_HOST: openmower
    #   MOWER_MQTT_PORT: "1883"
    #   MOWER_MQTT_USER: ""
    #   MOWER_MQTT_PASSWORD: ""

  # optional: updates MowBite, OpenMower and the MowBite Planner (set in the app: Settings, Updates), by hand or at
  # night with the mower idle in the dock. the only container here with docker: it goes through the stacks' own compose
  # files, goes back when a new version doesn't start and clears away old images. it needs the stacks' folder at the
  # same path inside: /opt/stacks is dockge's, change both sides if yours is elsewhere
  updater:
    image: ghcr.io/mkaaaaaay/mowbite-updater:latest
    container_name: mowbite-updater
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/stacks:/opt/stacks
      - /etc/localtime:/etc/localtime:ro

volumes:
  settings:
