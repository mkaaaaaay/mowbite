services:
  mowmate:
    # prebuilt for amd64 and arm64. `docker compose up -d --build` builds it yourself instead
    image: ghcr.io/mkaaaaaay/mowmate:latest
    build: .
    container_name: mowmate
    restart: unless-stopped
    ports:
      - "8082:8080"
    volumes:
      # settings shared by all devices (map colors etc.)
      - settings:/data
    # shows up on the openmower start page (xtech/web-openmower-entrypoint)
    labels:
      openmower.ui: "true"
      openmower.ui.name: "Mowmate"
      openmower.ui.port: "8082"
      openmower.ui.icon: "Grass"
      openmower.ui.description: "Map editor, tracks and sensors"
    # both optional. without a url the app connects to ws://<host it was opened from>:9001,
    # which is right when it runs on the mower
    # environment:
    #   MOWER_MQTT_WS_URL: ws://openmower:9001
    #   MOWER_MQTT_PREFIX: ""

volumes:
  settings:
