services:
  mowbite:
    # prebuilt for amd64 and arm64. `docker compose up -d --build` builds it yourself instead
    image: ghcr.io/mkaaaaaay/mowbite:latest
    build: .
    container_name: mowbite
    restart: unless-stopped
    # what it writes to docker's log kept small, the mower's disk is
    logging:
      options:
        max-size: 1m
        max-file: "2"
    ports:
      - "8082:8080"
    volumes:
      # settings shared by all devices (map colors etc.)
      - settings:/data
      # the mower's wifi signal for the coverage on the map, read only. leave it out and the map has no wifi layer
      - /proc/1/net:/host-net:ro
    # shows up on the openmower start page (xtech/web-openmower-entrypoint)
    labels:
      openmower.ui: "true"
      openmower.ui.name: "MowBite"
      openmower.ui.port: "8082"
      openmower.ui.icon: "Grass"
      openmower.ui.description: "Map editor, area recording, tracks, activity and sensors"
    # all optional. without a url the app connects to ws://<host it was opened from>:9001,
    # which is right when it runs on the mower. the sensor recorder finds the broker on the
    # mower by itself, the MOWER_MQTT_HOST lines are only for a broker somewhere else
    # environment:
    #   MOWER_MQTT_WS_URL: ws://openmower:9001
    #   MOWER_MQTT_PREFIX: ""
    #   MOWER_MQTT_HOST: openmower
    #   MOWER_MQTT_PORT: "1883"
    #   MOWER_MQTT_USER: ""
    #   MOWER_MQTT_PASSWORD: ""
    #   # MowBite opened from elsewhere too: its files on a web server of your own (or behind a proxy with another name),
    #   # comma separated
    #   MOWBITE_ORIGINS: https://mowbite.example.com
    #   # the MowBite Updater, when MowBite doesn't run on the mower (else it finds it by itself)
    #   UPDATER_URL: http://openmower:8083

  # the MowBite Updater (github.com/mkaaaaaay/mowbite-updater): updates MowBite, OpenMower and the MowBite Planner from
  # the app (Settings, Updates) or its own page (port 8083), by hand or at night, only with the mower idle in the dock.
  # nothing updates by itself until it's set. the only container here with docker: it goes through the stacks' own
  # compose files, goes back when a new version doesn't start and clears away old images. it needs the stacks' folder
  # at the same path inside: /opt/stacks is dockge's, change both sides if yours is elsewhere. not wanted: leave it out
  updater:
    image: ghcr.io/mkaaaaaay/mowbite-updater:latest
    container_name: mowbite-updater
    restart: unless-stopped
    network_mode: host
    logging:
      options:
        max-size: 1m
        max-file: "2"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/stacks:/opt/stacks
      - /etc/localtime:/etc/localtime:ro
      - /etc/os-release:/host/os-release:ro
    labels:
      openmower.ui: "true"
      openmower.ui.name: MowBite Updater
      openmower.ui.port: "8083"
      openmower.ui.icon: SystemUpdateAlt
      openmower.ui.description: Updates OpenMower, MowBite, the planner and other apps, with the mower idle in the dock

volumes:
  settings:
