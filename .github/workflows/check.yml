name: check

# lint, types, the tests and the click tests on a pull request, and for a push before anything goes out (release.yml)

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      # the route types (LayoutProps etc.) are generated, a fresh checkout doesn't have them yet
      - run: npx next typegen
      - run: npx tsc --noEmit
      # the tests of the awk scripts with the container's busybox awk on the path, not the runner's mawk
      - run: |
          docker create --name busybox "$(sed -n 's/^FROM \(busybox:[^ ]*\).*/\1/p' Dockerfile)" > /dev/null
          mkdir -p "$RUNNER_TEMP/busybox"
          docker cp busybox:/bin/busybox "$RUNNER_TEMP/busybox/busybox"
          docker rm busybox > /dev/null
          ln -s busybox "$RUNNER_TEMP/busybox/awk"
          echo "$RUNNER_TEMP/busybox" >> "$GITHUB_PATH"
      - run: npm test

  # the container's scripts: shellcheck, and the scheduler and the cgis in the built image with a pretend mower
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          sc="docker run --rm -v $PWD:/mnt:ro -w /mnt koalaman/shellcheck:v0.11.0 -S warning"
          $sc -s sh -e SC1091,SC2034 docker/*.sh docker/*.cgi test/case.sh
          $sc test/run.sh
      # both ways of installing take compose.yaml from main
      - run: docker compose -f compose.yaml config -q
      - run: test/run.sh

  # the click tests (e2e/) on a phone and a desktop, against the built app with the demo mower
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # the calibration isn't in releases yet, the click tests go through it
      - run: npm run build
        env:
          CALIBRATION: '1'
      # without --with-deps: the image has chromium's libraries, the click tests need none of its extra fonts and no apt
      - run: npx playwright install chromium
      - run: npm run e2e
      # what went wrong: the report with the screenshots and traces of the failed tests
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: playwright-report/
          retention-days: 7
