name: release

# what goes out, only after the checks passed on this very commit: the container for pc and mower (main -> :latest for
# everyone, dev -> :dev for testing, a version tag -> its version) and the app on a release (a version tag v1.2.3 gets
# its own, dev keeps rebuilding the "app-dev" pre-release). one run a ref at a time, an older one never overtakes a newer

on:
  push:
    branches: [main, dev]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    uses: ./.github/workflows/check.yml

  commits:
    uses: ./.github/workflows/commits.yml
    secrets:
      COMMIT_RULES: ${{ secrets.COMMIT_RULES }}

  # a version tag only on a commit of main, with the version of its package.json
  ref:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - if: github.ref_type == 'tag'
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::tag $GITHUB_REF_NAME isn't on main, push main first"
            exit 1
          fi
          if [ "${GITHUB_REF_NAME#v}" != "$(jq -r .version package.json)" ]; then
            echo "::error::tag $GITHUB_REF_NAME doesn't match the version in package.json"
            exit 1
          fi

  # amd64 + arm64. the app is compiled once natively, the arm image only gets files copied in, so no qemu needed
  image:
    needs: [check, commits, ref]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION_SUFFIX=${{ github.ref == 'refs/heads/dev' && format('dev.{0}', github.run_number) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # the app and the web app's static files as a zip, for a web server of your own. the apk only with the signing key in
  # the repo secrets, so a new version installs over the old one. nothing here writes to the repo
  apk:
    needs: [check, commits, ref, image]
    if: github.ref_type == 'tag' || github.ref == 'refs/heads/dev' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      VERSION_SUFFIX: ${{ github.ref_type != 'tag' && format('dev.{0}', github.run_number) || '' }}
    steps:
      - id: key
        env:
          KEYSTORE: ${{ secrets.MOWBITE_KEYSTORE }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::notice::no signing key in the repo secrets (MOWBITE_KEYSTORE), only the web app goes on the release"
            echo "skip=1" >> "$GITHUB_OUTPUT"
          else
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          fi

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: |
          npm ci
          npm run build
          mkdir -p "$RUNNER_TEMP/app"
          (cd out && zip -qr "$RUNNER_TEMP/app/web.zip" .)

      - if: steps.key.outputs.skip != '1'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - if: steps.key.outputs.skip != '1'
        uses: android-actions/setup-android@v4

      - if: steps.key.outputs.skip != '1'
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.1.0" > /dev/null
          npx cap sync android

      - if: steps.key.outputs.skip != '1'
        working-directory: android
        env:
          MOWBITE_KEYSTORE: ${{ runner.temp }}/release.jks
          MOWBITE_KEYSTORE_PASSWORD: ${{ secrets.MOWBITE_KEYSTORE_PASSWORD }}
          MOWBITE_KEY_ALIAS: ${{ secrets.MOWBITE_KEY_ALIAS }}
        run: |
          ./gradlew assembleRelease --no-daemon -q
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/app/app.apk"

      - uses: actions/upload-artifact@v7
        with:
          name: app
          path: ${{ runner.temp }}/app/
          retention-days: 1

  # a stable version (a tag without a dash, it becomes the latest release) waits for the ok in the environment "stable"
  stable:
    needs: apk
    if: github.ref_type == 'tag' && !contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    environment: stable
    steps:
      - run: echo "$GITHUB_REF_NAME goes out as the latest release"

  release:
    needs: [apk, stable]
    if: ${{ !cancelled() && needs.apk.result == 'success' && contains(fromJSON('["success", "skipped"]'), needs.stable.result) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: app
          path: ${{ runner.temp }}/app

      - env:
          GH_TOKEN: ${{ github.token }}
          APP: ${{ runner.temp }}/app
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version=${GITHUB_REF_NAME#v}
            mv "$APP/web.zip" MowBite-web.zip
            files=(MowBite-web.zip)
            if [ -f "$APP/app.apk" ]; then mv "$APP/app.apk" MowBite.apk && files=(MowBite.apk "${files[@]}"); fi
            # the release notes are the message of the annotated tag, the checkout only has the commit
            git fetch -q --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
            # a version like 1.3.0-beta.1 becomes a pre-release and doesn't replace the latest one
            case "$version" in *-*) kind=(--prerelease --latest=false) ;; *) kind=(--latest) ;; esac
            gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 ||
              gh release create "$GITHUB_REF_NAME" --verify-tag "${kind[@]}" --title "MowBite $version" --notes-from-tag
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
          else
            mv "$APP/web.zip" MowBite-web-dev.zip
            files=(MowBite-web-dev.zip)
            if [ -f "$APP/app.apk" ]; then mv "$APP/app.apk" MowBite-dev.apk && files=(MowBite-dev.apk "${files[@]}"); fi
            gh release view app-dev > /dev/null 2>&1 || gh release create app-dev --prerelease --title "MowBite app (dev)" \
              --notes "Test version from the $GITHUB_REF_NAME branch, might be broken. Rebuilt with every change on it." --target "$GITHUB_SHA"
            gh release upload app-dev "${files[@]}" --clobber
            # the tag follows the newest build
            git tag -f app-dev && git push -f origin refs/tags/app-dev
          fi
